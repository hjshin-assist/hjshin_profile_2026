<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>

  <!-- Browser Window Wrapper -->
  <g transform="translate(30, 25)">
    <rect width="1140" height="710" rx="16" fill="#ffffff" filter="url(#card-shadow)" />
    
    <!-- Browser Top Bar -->
    <rect width="1140" height="44" rx="16" fill="#f8fafc" />
    <rect y="28" width="1140" height="16" fill="#f8fafc" />
    <line x1="0" y1="44" x2="1140" y2="44" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="24" cy="22" r="6" fill="#ef4444" />
    <circle cx="44" cy="22" r="6" fill="#f59e0b" />
    <circle cx="64" cy="22" r="6" fill="#10b981" />

    <!-- URL Bar -->
    <rect x="110" y="10" width="720" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" />
    <text x="125" y="26" font-size="12" fill="#64748b">https://champ.hackers.com/basic-english/plan</text>

    <!-- Stage Tag in Browser Bar -->
    <rect x="860" y="8" width="260" height="28" rx="8" fill="#dbeafe" />
    <text x="990" y="26" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">2단계: Plan (기획안 와이어프레임)</text>

    <!-- Page Content Container -->
    <g transform="translate(0, 44)">
      <!-- Top Site Navigation Header -->
      <rect width="1140" height="52" fill="#ffffff" />
      <line x1="0" y1="52" x2="1140" y2="52" stroke="#e2e8f0" stroke-width="1" />
      
      <!-- Logo -->
      <text x="40" y="33" font-size="19" font-weight="900" fill="#dc2626" letter-spacing="-0.5">HACKERS<tspan fill="#1e293b" font-size="16" font-weight="700"> TALK</tspan></text>
      
      <!-- Nav Items -->
      <text x="240" y="32" font-size="13" font-weight="600" fill="#475569">기초영어</text>
      <text x="320" y="32" font-size="13" font-weight="600" fill="#475569">영어회화</text>
      <text x="400" y="32" font-size="13" font-weight="600" fill="#475569">영문법</text>
      <text x="470" y="32" font-size="13" font-weight="600" fill="#475569">비즈니스</text>
      <text x="550" y="32" font-size="13" font-weight="800" fill="#dc2626">이벤트/환급</text>

      <rect x="1010" y="12" width="90" height="28" rx="6" fill="#1e293b" />
      <text x="1055" y="30" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">로그인</text>

      <!-- Main Visual Hero Banner -->
      <rect y="52" width="1140" height="220" fill="url(#bannerGrad)" />
      
      <!-- Subtle Pattern Grid in Hero for Plan, Glow for Final -->
      <line x1="0" y1="100" x2="1140" y2="100" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="6,6"/><line x1="0" y1="180" x2="1140" y2="180" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="6,6"/>
      
      <!-- Stage Notice Pill -->
      <g transform="translate(50, 78)">
        <rect width="170" height="28" rx="14" fill="#ffffff" fill-opacity="0.2" />
        <text x="85" y="18" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">신규 기획 와이어프레임</text>
      </g>

      <!-- Main Title -->
      <text x="50" y="145" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-1">2023 기초영문법 환급패스</text>
      <text x="50" y="180" font-size="16" font-weight="500" fill="#ffffff" fill-opacity="0.9">동기부여 환급 시스템과 수준별 기초 회화 결합 상품</text>

      <!-- Hero Callout Box (Right Side) -->
      <g transform="translate(740, 75)">
        <rect width="350" height="170" rx="12" fill="#ffffff" filter="url(#card-shadow)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
        <text x="20" y="32" font-size="14" font-weight="800" fill="#1e293b">기획안 핵심 설계안</text>
        <line x1="20" y1="44" x2="330" y2="44" stroke="#e2e8f0" stroke-width="1" />
        <text x="20" y="72" font-size="12" font-weight="600" fill="#334155">• 출석 100% 환급 3단계 인포그래픽 로드맵 기획</text>
        <text x="20" y="98" font-size="12" font-weight="600" fill="#334155">• 왕초보 탈출 4주 커리큘럼 인터랙티브 탭 와이어프레임</text>
        <text x="20" y="124" font-size="12" font-weight="600" fill="#334155">• 얼리버드 교재 무료 + 태블릿 패키징 옵션 구조화</text>
        <rect x="20" y="136" width="310" height="24" rx="4" fill="#dbeafe" />
        <text x="175" y="152" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">기획 핵심: 심리적 진입장벽 해소 & 혜택 극대화</text>
      </g>

      <!-- Lower Content Area (3 Columns of Section Cards) -->
      <g transform="translate(50, 290)">
        <!-- Card 1 -->
        <g transform="translate(0, 0)">
          <rect width="325" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" fill="#f8fafc" stroke="#94a3b8" />
          <rect width="325" height="44" rx="12" fill="#eff6ff" />
          <rect y="28" width="325" height="16" fill="#eff6ff" />
          <text x="16" y="28" font-size="14" font-weight="800" fill="#1e40af">[Plan] 환급 인포그래픽</text>
          
          <!-- Mock Graphic Box in Card 1 -->
          <rect x="16" y="58" width="293" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
          <text x="162" y="115" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">[와이어프레임: 1단계->2단계->환급]</text>
          
          <text x="16" y="205" font-size="12" font-weight="700" fill="#1e293b">1일 1강 출석만 해도 전액 환급</text>
          <text x="16" y="228" font-size="11" fill="#64748b">까다로운 성적표 제출 의무 없음</text>
          <text x="16" y="248" font-size="11" fill="#64748b">동기부여 게이지 시각화</text>

          <rect x="16" y="270" width="293" height="36" rx="8" fill="#3b82f6" />
          <text x="162" y="293" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">로드맵 확정</text>
        </g>

        <!-- Card 2 -->
        <g transform="translate(355, 0)">
          <rect width="325" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" fill="#f8fafc" stroke="#94a3b8" />
          <rect width="325" height="44" rx="12" fill="#eff6ff" />
          <rect y="28" width="325" height="16" fill="#eff6ff" />
          <text x="16" y="28" font-size="14" font-weight="800" fill="#1e40af">[Plan] 레벨별 커리큘럼 탭</text>
          
          <!-- Mock Graphic Box in Card 2 -->
          <rect x="16" y="58" width="293" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
          <text x="162" y="115" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">[와이어프레임: 탭 1 | 탭 2 | 탭 3]</text>
          
          <text x="16" y="205" font-size="12" font-weight="700" fill="#1e293b">알파벳 파닉스부터 실전 회화까지</text>
          <text x="16" y="228" font-size="11" fill="#64748b">주차별 학습 목표 뱃지 부여</text>
          <text x="16" y="248" font-size="11" fill="#64748b">강의별 1분 미리보기 팝업</text>

          <rect x="16" y="270" width="293" height="36" rx="8" fill="#2563eb" />
          <text x="162" y="293" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">커리큘럼 승인</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(710, 0)">
          <rect width="330" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" fill="#f8fafc" stroke="#94a3b8" />
          <rect width="330" height="44" rx="12" fill="#eff6ff" />
          <rect y="28" width="330" height="16" fill="#eff6ff" />
          <text x="16" y="28" font-size="14" font-weight="800" fill="#1e40af">[Plan] 올인원 패키지 옵션</text>
          
          <!-- Mock Graphic Box in Card 3 -->
          <rect x="16" y="58" width="298" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
          <text x="165" y="115" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">[와이어프레임: 패키지 가격표]</text>
          
          <text x="16" y="205" font-size="12" font-weight="700" fill="#1e293b">강의+베스트셀러 교재 3권 0원</text>
          <text x="16" y="228" font-size="11" fill="#64748b">1:1 발음 코칭권 추가 옵션</text>
          <text x="16" y="248" font-size="11" fill="#64748b">월 1만원대 가성비 어필</text>

          <rect x="16" y="270" width="298" height="36" rx="8" fill="#4f46e5" />
          <text x="165" y="293" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">패키징 완료</text>
        </g>
      </g>

      <!-- Bottom Floating Banner -->
      <g transform="translate(50, 625)">
        <rect width="1040" height="32" rx="6" fill="#e0e7ff" />
        <text x="520" y="21" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">기획 성과: 복잡했던 구매 프로세스를 3단계로 단순화</text>
      </g>
    </g>
  </g>
</svg>