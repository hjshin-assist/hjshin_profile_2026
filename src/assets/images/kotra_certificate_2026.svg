<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="650" fill="url(#bgGradient)" />

  <!-- Background Grid & Accents -->
  <circle cx="100" cy="100" r="250" fill="#4f46e5" opacity="0.1" />
  <circle cx="1100" cy="550" r="300" fill="#9333ea" opacity="0.1" />

  <!-- Main Portal Container -->
  <g transform="translate(100, 40)" filter="url(#shadow)">
    <!-- Browser Mockup Window Header -->
    <rect width="1000" height="570" rx="20" fill="#1e293b" />
    
    <!-- Window Controls -->
    <circle cx="30" cy="25" r="6" fill="#ef4444" />
    <circle cx="50" cy="25" r="6" fill="#f59e0b" />
    <circle cx="70" cy="25" r="6" fill="#10b981" />

    <!-- Address Bar -->
    <rect x="100" y="12" width="800" height="26" rx="8" fill="#0f172a" />
    <text x="500" y="29" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">🔒 https://kotra-assist-certificate-2026.vercel.app [AI 수료증 자동 발급 포털]</text>

    <!-- Main Content Area -->
    <rect x="0" y="50" width="1000" height="520" rx="0" fill="#f8fafc" />

    <!-- Top Banner inside Web App -->
    <rect x="0" y="50" width="1000" height="60" fill="#4338ca" />
    <text x="40" y="87" font-size="18" font-weight="800" fill="#ffffff">KOTRA &amp; aSSIST 글로벌 비즈니스 AI 수료증 자동 발급 센터</text>
    <rect x="800" y="65" width="160" height="30" rx="8" fill="#10b981" />
    <text x="880" y="85" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">⚡ 1분 자동 검증완료</text>

    <!-- Left Form Panel -->
    <g transform="translate(40, 130)">
      <rect width="380" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="24" y="36" font-size="16" font-weight="800" fill="#0f172a">수강생 본인 인증 &amp; 발급 신청</text>
      <text x="24" y="56" font-size="12" fill="#64748b">성명과 비밀번호 입력 시 AI 수료 내역이 즉시 조회됩니다.</text>

      <!-- Input 1 -->
      <text x="24" y="95" font-size="12" font-weight="700" fill="#334155">성명 (Learner Name)</text>
      <rect x="24" y="105" width="332" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="36" y="130" font-size="14" font-weight="700" fill="#0f172a">신혜진 (Hyejin Shin)</text>

      <!-- Input 2 -->
      <text x="24" y="170" font-size="12" font-weight="700" fill="#334155">생년월일 / 수강생 식별코드</text>
      <rect x="24" y="180" width="332" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="36" y="205" font-size="14" font-weight="700" fill="#0f172a">980412-2******</text>

      <!-- Course Badge -->
      <rect x="24" y="240" width="332" height="50" rx="10" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="36" y="260" font-size="11" font-weight="700" fill="#1d4ed8">조회된 교육 과정명</text>
      <text x="36" y="278" font-size="13" font-weight="800" fill="#1e40af">KOTRA-aSSIST AI 생성형 업무 자동화 마스터 과정</text>

      <!-- Submit Button -->
      <rect x="24" y="310" width="332" height="46" rx="12" fill="#4f46e5" />
      <text x="190" y="338" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">📄 PDF 수료증 검증 및 즉시 다운로드</text>

      <text x="190" y="380" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">✓ 기존 수작업 20분 → 1분 자동 처리 완료 (문의 0건)</text>
    </g>

    <!-- Right Certificate Preview Panel -->
    <g transform="translate(450, 130)">
      <rect width="510" height="420" rx="16" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2" />
      <!-- Gold Certificate Border -->
      <rect x="12" y="12" width="486" height="396" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4" />

      <!-- Certificate Header -->
      <text x="255" y="55" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle" letter-spacing="2">aSSIST &amp; KOTRA OFFICIAL CERTIFICATE</text>
      <text x="255" y="90" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="4">수  료  증</text>

      <!-- Details -->
      <text x="70" y="140" font-size="13" font-weight="700" fill="#475569">성        명 : <tspan fill="#0f172a" font-weight="800">신 혜 진</tspan></text>
      <text x="70" y="165" font-size="13" font-weight="700" fill="#475569">과  정  명 : <tspan fill="#0f172a" font-weight="800">2026 AI 기반 업무 프로세스 자동화 과정</tspan></text>
      <text x="70" y="190" font-size="13" font-weight="700" fill="#475569">교육 기간 : <tspan fill="#0f172a" font-weight="800">2026년 05월 10일 ~ 05월 24일</tspan></text>

      <text x="255" y="240" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">위 사람은 KOTRA와 서울과학종합대학원(aSSIST)이 공동 주관하는</text>
      <text x="255" y="260" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">AI 프로세스 혁신 교육 과정을 성공적으로 수료하였으므로 이 증서를 수여합니다.</text>

      <text x="255" y="305" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">2026년 05월 24일</text>

      <!-- Stamp Seal & Barcode -->
      <circle cx="390" cy="340" r="32" fill="#dc2626" opacity="0.9" />
      <text x="390" y="338" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">서울과학</text>
      <text x="390" y="350" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">종합대학원</text>

      <!-- Verification QR / Barcode -->
      <rect x="60" y="325" width="100" height="30" fill="#e2e8f0" rx="4" />
      <text x="110" y="344" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">QR VERIFIED</text>
    </g>
  </g>
</svg>
